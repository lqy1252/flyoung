<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>品牌官网</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="#top">
        <img id="logoImg" src="" alt="logo">
        <span id="logoText" class="logo-text"></span>
      </a>
      <nav class="nav">
        <a href="#top">首页</a>
        <a href="#product">产品</a>
        <a href="#feature">特性</a>
        <a href="#detail">详情</a>
      </nav>
      <button class="nav-toggle" aria-label="打开菜单">☰</button>
    </div>
  </header>

  <section class="hero" id="top">
    <img id="heroImg" src="" alt="">
  </section>

  <main class="container">
    <section class="block block--narrow" id="product">
      <img id="productImg" src="" alt="">
    </section>
    <section class="block" id="feature">
      <img id="featureImg" src="" alt="">
    </section>
    <section class="block" id="detail">
      <img id="detailImg" src="" alt="">
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner" id="footerText"></div>
  </footer>

  <button class="back-top" id="backTop" aria-label="返回顶部">↑</button>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
